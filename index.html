<!DOCTYPE html>
<html lang="es" data-theme="light" data-fs="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0c0a">
<title>El Lugar · Biblia</title>
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Alef:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ========== ESTILOS COMPLETOS (sin cambios) ========== */
:root{
  --ink:#1a1410; --ink2:#4a3f35; --ink3:#8a7a6a; --ink4:#b0a898;
  --parch:#f5f0e8; --parch2:#ede5d4; --parch3:#dfd5c0;
  --gold:#b8860b; --gold2:#d4a017; --gold3:#f5c842;
  --crimson:#8b1a1a; --cobalt:#1a3a8b; --emerald:#1a6b3a;
  --card:#faf7f0; --card2:#f0ebe0;
  --border:rgba(184,134,11,.22); --border2:rgba(184,134,11,.1);
  --shadow:rgba(26,20,16,.1); --shadow2:rgba(26,20,16,.2);
  --radius:14px; --radius-sm:8px;
  --r:'Playfair Display',Georgia,serif;
  --m:'IBM Plex Mono',monospace;
  --h:'Alef','Noto Serif Hebrew',serif;
  --nav-h:60px; --hdr-h:52px;
}
[data-theme="dark"]{
  --ink:#e8e0d0; --ink2:#b0a090; --ink3:#6a5a50; --ink4:#4a3e35;
  --parch:#0d0b09; --parch2:#161210; --parch3:#1e1a14;
  --card:#181410; --card2:#201c16;
  --border:rgba(184,134,11,.16); --border2:rgba(184,134,11,.08);
  --shadow:rgba(0,0,0,.3); --shadow2:rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--parch)}
body{font-family:var(--r);color:var(--ink);font-size:16px;transition:background .25s,color .25s}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--parch);pointer-events:none;opacity:0;transition:opacity .28s,transform .28s}
.layer.show{pointer-events:auto;opacity:1;transform:none!important}
.layer.slide-up{transform:translateY(100%)}
.layer.slide-in{transform:translateX(100%)}
#l-splash{justify-content:center;align-items:center;background:radial-gradient(ellipse at 30% 40%,#1a0830 0%,#08040c 100%);z-index:900}
.sp-inner{position:relative;z-index:1;text-align:center;animation:rise .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.sp-logo{width:100px;margin:0 auto 24px;display:block;filter:drop-shadow(0 0 30px rgba(184,134,11,.45))}
.sp-tag{font-family:var(--m);font-size:.62rem;letter-spacing:.55em;color:var(--gold3);text-transform:uppercase;margin-bottom:6px}
.sp-name{font-family:var(--r);font-size:2.2rem;font-weight:900;color:#f0e8d0;letter-spacing:.1em;line-height:1;margin-bottom:10px}
.sp-verse{font-family:var(--r);font-style:italic;font-size:.7rem;color:rgba(184,134,11,.65);letter-spacing:.04em;margin-bottom:32px;line-height:1.5}
.sp-bar{width:160px;height:1px;background:rgba(184,134,11,.18);margin:0 auto;position:relative}
.sp-bar::after{content:'';position:absolute;inset:0;background:var(--gold);animation:bar 1.5s ease-in-out forwards;transform:scaleX(0);transform-origin:left}
@keyframes bar{to{transform:scaleX(1)}}
#l-login{justify-content:center;align-items:center;padding:28px;z-index:800;background:radial-gradient(ellipse at 30% 30%,#1a0830 0%,#08040c 100%)}
.lx-card{position:relative;background:var(--parch);border:1px solid var(--border);border-radius:20px;padding:38px 30px;width:100%;max-width:380px;box-shadow:0 32px 80px rgba(0,0,0,.55);animation:pop .5s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.lx-logo{width:58px;margin:0 auto 18px;display:block}
.lx-hed{font-family:var(--r);font-size:1.5rem;font-weight:700;color:var(--ink);text-align:center;margin-bottom:4px}
.lx-sub{font-family:var(--r);font-style:italic;font-size:.76rem;color:var(--ink3);text-align:center;line-height:1.7;margin-bottom:26px}
.lx-field{margin-bottom:11px}
.lx-field input{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-family:var(--r);font-size:.92rem;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.lx-field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,11,.1)}
.lx-btn{width:100%;background:var(--ink);color:var(--parch);border:none;padding:14px;border-radius:var(--radius-sm);font-family:var(--m);font-size:.76rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:opacity .2s;margin-top:4px}
.lx-btn:active{opacity:.8}
[data-theme="dark"] .lx-btn{background:var(--gold);color:#08040c}
.lx-lider{font-family:var(--m);font-size:.58rem;letter-spacing:.15em;color:var(--ink3);cursor:pointer;text-align:center;margin-top:16px;display:block;text-transform:uppercase;transition:color .2s}
.lx-lider:hover{color:var(--gold)}
.lx-lider-box{overflow:hidden;max-height:0;transition:max-height .3s}
.lx-lider-box.open{max-height:70px}
.lx-lider-input{width:100%;padding:11px;border:1px dashed var(--border);border-radius:var(--radius-sm);font-family:var(--m);font-size:.82rem;color:var(--gold);background:transparent;outline:none;text-align:center;letter-spacing:.22em;margin-top:10px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .3s;z-index:100}
#app.show{pointer-events:auto;opacity:1}
#hdr{flex-shrink:0;height:var(--hdr-h);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border2);background:var(--parch);backdrop-filter:blur(14px);position:sticky;top:0;z-index:50}
[data-theme="dark"] #hdr{background:rgba(8,4,12,.92)}
.hdr-left{display:flex;align-items:center;gap:8px}
#hdr-back{background:none;border:none;cursor:pointer;color:var(--gold);font-size:1.1rem;padding:7px;display:none;line-height:1;border-radius:6px;transition:background .15s}
#hdr-back:active{background:rgba(184,134,11,.12)}
#hdr-title{font-family:var(--m);font-size:.68rem;font-weight:500;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase}
.hdr-right{display:flex;gap:2px}
.hdr-act{background:none;border:none;cursor:pointer;padding:8px;color:var(--ink3);font-size:1.05rem;border-radius:6px;transition:color .2s,background .15s}
.hdr-act:hover,.hdr-act:active{color:var(--gold);background:rgba(184,134,11,.08)}
#ca{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));scroll-behavior:smooth}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--parch);border-top:1px solid var(--border2);display:flex}
[data-theme="dark"] #nav{background:rgba(8,4,12,.96)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink3);border:none;background:none;transition:color .2s;padding:0;min-width:0}
.nav-btn.on{color:var(--gold)}
.nav-ico{font-size:1.18rem;line-height:1}
.nav-lbl{font-family:var(--m);font-size:.44rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.nav-pez{width:20px;height:auto;opacity:.4;transition:opacity .2s;filter:grayscale(1)}
.nav-btn.on .nav-pez{opacity:1;filter:none}
.divider{height:1px;margin:0 16px;background:linear-gradient(to right,transparent,var(--border),transparent)}
.section-lbl{font-family:var(--m);font-size:.58rem;font-weight:500;letter-spacing:.24em;color:var(--ink3);text-transform:uppercase;padding:18px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.section-lbl button{background:var(--gold);color:#fff;border:none;padding:5px 12px;border-radius:20px;font-family:var(--m);font-size:.52rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.fade-in{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.badge{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-family:var(--m);font-size:.46rem;font-weight:500;letter-spacing:.1em;padding:2px 7px;border-radius:20px;text-transform:uppercase;vertical-align:middle;margin-left:5px}
.spin{display:inline-block;width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.verse-hero{margin:14px;border-radius:16px;overflow:hidden;position:relative;background:var(--ink);padding:28px 22px;box-shadow:0 12px 40px var(--shadow2)}
.vhero-tag{font-family:var(--m);font-size:.56rem;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.vhero-tag::before,.vhero-tag::after{content:'';flex:1;height:1px;background:rgba(184,134,11,.3)}
.vhero-text{font-family:var(--r);font-style:italic;font-size:1rem;color:rgba(245,240,232,.92);line-height:1.82;margin-bottom:12px;position:relative;z-index:1}
.vhero-ref{font-family:var(--m);font-size:.62rem;color:var(--gold);letter-spacing:.1em;position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center}
.vhero-share{background:none;border:1px solid rgba(184,134,11,.35);color:var(--gold);padding:4px 11px;border-radius:20px;font-family:var(--m);font-size:.55rem;cursor:pointer;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:all .2s}
.vhero-share:active{background:rgba(184,134,11,.2)}
.streak-bar{margin:0 14px 4px;background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px var(--shadow)}
.streak-ico{font-size:1.6rem;flex-shrink:0}
.streak-info{flex:1;min-width:0}
.streak-n{font-family:var(--r);font-size:1.3rem;font-weight:900;color:var(--gold);line-height:1}
.streak-l{font-family:var(--m);font-size:.56rem;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.streak-prog{flex:1;min-width:0}
.streak-books{font-family:var(--r);font-size:.75rem;font-weight:700;color:var(--ink);line-height:1}
.streak-sub{font-family:var(--m);font-size:.52rem;color:var(--ink3);margin-top:1px;letter-spacing:.06em}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 14px 6px}
.qa-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:16px 13px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden}
.qa-card:active{transform:scale(.96);box-shadow:0 2px 8px var(--shadow)}
.qa-ico{font-size:1.4rem}
.qa-t{font-family:var(--r);font-size:.8rem;font-weight:700;color:var(--ink)}
.qa-d{font-family:var(--m);font-size:.55rem;color:var(--ink3);letter-spacing:.03em}
.qa-card.accent{background:linear-gradient(135deg,var(--ink) 0%,#2a1040 100%);border-color:rgba(184,134,11,.3)}
.qa-card.accent .qa-t,.qa-card.accent .qa-d{color:rgba(245,240,232,.8)}
.home-ref-card{margin:0 14px 10px;background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;box-shadow:0 2px 8px var(--shadow);cursor:pointer;transition:transform .15s}
.home-ref-card:active{transform:scale(.98)}
.rc-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.rc-avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--parch);display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:.72rem;font-weight:500;flex-shrink:0}
.rc-name{font-family:var(--m);font-size:.63rem;font-weight:500;letter-spacing:.05em;color:var(--gold)}
.rc-date{font-family:var(--m);font-size:.52rem;color:var(--ink3);margin-top:1px}
.rc-title{font-family:var(--r);font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:0}
.lib-section{padding:18px 14px 8px;display:flex;align-items:center;gap:10px}
.lib-sec-t{font-family:var(--r);font-size:1rem;font-weight:700;color:var(--ink)}
.lib-sec-count{background:rgba(184,134,11,.1);color:var(--gold);border-radius:20px;padding:2px 9px;font-family:var(--m);font-size:.56rem;font-weight:500}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 14px 6px}
@media(min-width:420px){.book-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:560px){.book-grid{grid-template-columns:repeat(4,1fr)}}
.bk{border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;padding:14px 5px 11px;background:url('manuscrito.jpg') center/cover no-repeat;isolation:isolate;box-shadow:0 4px 16px var(--shadow2);transition:transform .18s;border:1px solid rgba(139,100,20,.35)}
.bk::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.07) 0%,rgba(0,0,0,.2) 100%);z-index:0}
.bk::after,.bk-rod{content:'';position:absolute;left:0;right:0;background:linear-gradient(to right,transparent,rgba(184,134,11,.5),transparent);height:2px;z-index:1}
.bk::after{top:0}.bk-rod{bottom:0}
.bk:active{transform:scale(.94)}
.bk-orig{font-family:var(--h);font-size:clamp(1.5rem,6vw,2.2rem);font-weight:700;color:#1a0033;line-height:1.1;text-align:center;margin-bottom:3px;min-height:30px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 6px rgba(255,255,255,.98),0 0 14px rgba(255,255,255,.7);position:relative;z-index:2;word-break:break-word}
.bk-orig.gr{font-family:var(--r);font-style:italic;font-size:clamp(1.1rem,4.5vw,1.7rem)}
.bk-translit{font-family:var(--r);font-style:italic;font-size:clamp(.66rem,2.6vw,.88rem);color:#1e0040;text-align:center;line-height:1.2;text-shadow:0 1px 4px rgba(255,255,255,.95);position:relative;z-index:2;font-weight:700;margin-bottom:3px}
.bk-name{font-family:var(--m);font-size:clamp(.62rem,2.4vw,.8rem);font-weight:500;color:#1a0033;text-transform:uppercase;letter-spacing:.04em;text-align:center;text-shadow:0 1px 4px rgba(255,255,255,.95);border-top:1px dashed rgba(139,91,26,.45);padding-top:4px;margin-top:2px;position:relative;z-index:2}
.bk-caps{font-family:var(--m);font-size:clamp(.48rem,1.7vw,.58rem);color:#2a0050;margin-top:2px;text-align:center;opacity:.9;text-shadow:0 1px 3px rgba(255,255,255,.85);position:relative;z-index:2}
.bk.read .bk-rod{background:linear-gradient(to right,transparent,rgba(0,120,60,.55),transparent)}
.bk-fav-dot{position:absolute;top:5px;right:6px;font-size:.7rem;z-index:3;line-height:1}
.cap-header{padding:22px 14px 14px;text-align:center;background:linear-gradient(to bottom,rgba(184,134,11,.05),transparent)}
.cap-orig{font-family:var(--h);font-size:2.2rem;color:var(--gold);display:block;margin-bottom:3px}
.cap-orig.gr{font-family:var(--r);font-style:italic;font-size:1.7rem}
.cap-translit{font-family:var(--r);font-style:italic;font-size:.82rem;color:var(--ink3);margin-bottom:5px}
.cap-nombre{font-family:var(--r);font-size:1.25rem;font-weight:700;color:var(--ink)}
.cap-meta{font-family:var(--m);font-size:.58rem;color:var(--ink3);letter-spacing:.06em;margin-top:3px}
.cap-prog-row{display:flex;align-items:center;gap:8px;padding:8px 14px 14px}
.cap-prog-bar{flex:1;height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.cap-prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s}
.cap-prog-lbl{font-family:var(--m);font-size:.55rem;color:var(--ink3);white-space:nowrap}
.cap-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 14px 14px}
@media(min-width:400px){.cap-grid{grid-template-columns:repeat(6,1fr)}}
.cap-btn{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--m);font-size:.76rem;font-weight:500;color:var(--ink2);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center}
.cap-btn:active{background:var(--gold);color:#fff;border-color:var(--gold);transform:scale(.88)}
.cap-btn.leido{background:rgba(184,134,11,.1);border-color:rgba(184,134,11,.3);color:var(--gold)}
.reader-hd{padding:14px 14px 10px;text-align:center;border-bottom:1px solid var(--border2);background:linear-gradient(to bottom,rgba(184,134,11,.04),transparent);position:relative}
.rdh-book{font-family:var(--m);font-size:.58rem;font-weight:500;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;margin-bottom:2px}
.rdh-cap{font-family:var(--r);font-size:1.85rem;font-weight:900;color:var(--ink);line-height:1}
.rdh-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.rdh-ctrl-btn{background:var(--card2);border:1px solid var(--border);color:var(--ink3);padding:5px 11px;border-radius:20px;font-family:var(--m);font-size:.56rem;cursor:pointer;font-weight:500;letter-spacing:.07em;text-transform:uppercase;transition:all .2s}
.rdh-ctrl-btn.on{background:var(--ink);color:var(--parch);border-color:var(--ink)}
[data-theme="dark"] .rdh-ctrl-btn.on{background:var(--gold);color:#08040c;border-color:var(--gold)}
.rdh-ctrl-btn:active{transform:scale(.94)}
.verses{padding:18px 16px 22px}
.vrow{display:flex;gap:11px;margin-bottom:13px;border-radius:7px;transition:background .2s;padding:2px 4px;animation:vfade .25s ease both;position:relative}
@keyframes vfade{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
.vrow[data-hl="y"]{background:#fff7b0;padding:3px 6px}
.vrow[data-hl="g"]{background:#d0f0d0;padding:3px 6px}
.vrow[data-hl="b"]{background:#c8e4f6;padding:3px 6px}
.vrow[data-hl="p"]{background:#f2d0f0;padding:3px 6px}
.vrow[data-hl="r"]{background:#f6d0d0;padding:3px 6px}
[data-theme="dark"] .vrow[data-hl="y"]{background:rgba(255,220,50,.16)}
[data-theme="dark"] .vrow[data-hl="g"]{background:rgba(80,200,80,.13)}
[data-theme="dark"] .vrow[data-hl="b"]{background:rgba(80,160,240,.13)}
[data-theme="dark"] .vrow[data-hl="p"]{background:rgba(200,80,200,.13)}
[data-theme="dark"] .vrow[data-hl="r"]{background:rgba(220,60,60,.13)}
.vrow.bookmarked::before{content:'🔖';position:absolute;right:18px;font-size:.7rem;margin-top:-2px;pointer-events:none}
.vnum{font-family:var(--m);font-size:.6rem;color:var(--gold3);min-width:20px;padding-top:5px;text-align:right;cursor:pointer;user-select:none;flex-shrink:0;transition:color .15s}
.vnum:active{color:var(--gold)}
.vtxt{font-family:var(--r);font-size:1rem;line-height:1.85;color:var(--ink);flex:1}
[data-fs="small"] .vtxt{font-size:.84rem;line-height:1.72}
[data-fs="large"] .vtxt{font-size:1.16rem;line-height:1.96}
[data-fs="xlarge"] .vtxt{font-size:1.38rem;line-height:2.08}
.sw{color:var(--cobalt);border-bottom:1.5px dotted rgba(26,58,139,.45);cursor:pointer;border-radius:2px;transition:background .12s}
[data-theme="dark"] .sw{color:#7aadff;border-bottom-color:rgba(122,173,255,.45)}
.sw:active{background:rgba(26,58,139,.1)}
.vtxt.ilin{display:flex;flex-wrap:wrap;gap:3px 5px;align-items:flex-end;line-height:1}
.iw{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;padding:2px;border-radius:3px;transition:background .12s}
.iw:active{background:rgba(184,134,11,.12)}
.iw-t{font-family:var(--r);font-size:inherit;color:var(--ink);line-height:1.4}
.iw-c{font-family:var(--m);font-size:.48rem;color:var(--gold);letter-spacing:.04em;margin-top:1px}
.iw-plain{font-family:var(--r);font-size:inherit;color:var(--ink);line-height:1.4}
.cap-nav{display:flex;gap:8px;padding:6px 14px 4px}

.toggle{width:40px;height:22px;border-radius:11px;background:var(--border2);position:relative;transition:background .3s;flex-shrink:0}

.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;top:2px;left:2px;border-radius:50%;transition:left .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:20px}
.fs-row{display:flex;gap:7px;padding:8px 0 12px;width:100%}

.fs-btn.on{background:var(--ink);border-color:var(--ink);color:var(--parch)}
[data-theme="dark"] .fs-btn.on{background:var(--gold);border-color:var(--gold);color:#08040c}
.btn-logout{width:calc(100% - 28px);margin:16px 14px;padding:12px;background:transparent;border:1px solid var(--crimson);border-radius:var(--radius-sm);color:var(--crimson);font-family:var(--m);font-size:.7rem;font-weight:500;letter-spacing:.1em;cursor:pointer;text-transform:uppercase;transition:all .2s}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end}

.modal-card{width:100%;background:var(--parch);border-radius:20px 20px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));animation:su .26s cubic-bezier(.16,1,.3,1);max-height:90vh;overflow-y:auto}

textarea.modal-input{resize:none;min-height:88px}
.modal-btns{display:flex;gap:8px}
.modal-btn{flex:1;padding:11px;border-radius:var(--radius-sm);font-family:var(--m);font-size:.66rem;font-weight:500;letter-spacing:.07em;cursor:pointer;border:none;text-transform:uppercase}

<!-- SPLASH -->
<div class="layer show" id="l-splash">

    <div class="sp-verse">«Lámpara es a mis pies tu palabra, y lumbrera a mi camino» — Sal 119:105</div>

  </div>

<!-- LOGIN -->
<div class="layer slide-up" id="l-login">
  <div class="lx-card">

      <input type="password" id="in-lider" class="lx-lider-input" placeholder="••••••••" autocomplete="off">
    </div>
  </div>
</div>

// Helper: busca entrada en diccionario tolerando padding de ceros
function _dictEntry(dict, code) {
  if (!dict) return null;
  if (dict[code]) return dict[code];
  // H430 → H0430 y viceversa
  const m = code.match(/^([GH])0*(\d+)([A-Z]*)$/);
  if (!m) return null;
  const pfx = m[1], num = parseInt(m[2]), sfx = m[3]||'';
  return dict[`${pfx}${num}${sfx}`]
      || dict[`${pfx}${String(num).padStart(4,'0')}${sfx}`]
      || null;
}


// ── Formato v8: array de libros con {nombre, capitulos:[{numero, versiculos:[{numero,palabras:[{texto,strong,añadida}]}]}]}
function _normStr(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

function findBookInData(data, book) {
  if (!data || !Array.isArray(data)) return null;
  // 1. Por índice en ALL (mismo orden que el JSON)
  try {
    const order = ALL.map(b => b.id);
    const idx = order.indexOf(book.id);
    if (idx !== -1 && data[idx] && data[idx].capitulos) return data[idx];
  } catch(e){}
  // 2. Por nombre español normalizado (sin tildes, minúsculas)
  const target = _normStr(book.e);
  for (const b of data) {
    if (b && _normStr(b.nombre) === target) return b;
  }
  // 3. Por nombre parcial
  for (const b of data) {
    if (b && b.nombre && _normStr(b.nombre).startsWith(target.slice(0,5))) return b;
  }
  console.warn('Libro no encontrado:', book.e, '— disponibles:', data.slice(0,5).map(b=>b.nombre));
  return null;
}

function getChapterFromBook(bookData, cap) {
  if (!bookData || !bookData.capitulos) return null;
  // Buscar por numero
  return bookData.capitulos.find(c => c.numero === cap) || null;
}

// Convierte {palabras} → string con marcadores {texto|H1234} para parseVerse()
function palabrasToText(palabras) {
  if (!palabras || !palabras.length) return '';
  return palabras.map(p => {
    const t = p.texto || '';
    // Palabras añadidas sin strong: texto plano (se mostrarán en color diferente via CSS)
    if (!p.strong) return t;
    // Palabras con strong (con o sin añadida): marcar con código
    return `{${t}|${p.strong}}`;
  }).join(' ');
}

async function _fetchVersos(l, cap) {
  const data = await loadBibleData();
  const bookData = findBookInData(data, l);
  if (!bookData) throw new Error(`Libro "${l.e}" no encontrado`);
  const chapterData = getChapterFromBook(bookData, cap);
  if (!chapterData) throw new Error(`Capítulo ${cap} no encontrado en "${l.e}"`);
  const versiculos = chapterData.versiculos;
  if (!versiculos || !versiculos.length) throw new Error('Capítulo vacío');
  return versiculos.map(v => ({
    n: v.numero,
    t: subst(palabrasToText(v.palabras))
  }));
}

function cleanVerse(txt){ return txt.replace(/\{([^|{}]+)\|[GH][\d_A-Z]+\}/g,'$1').replace(/\{[^}]+\}/g,''); }
function parseVerse(txt,isG,interlinear=false){
  const segments=[]; let last=0; const re=/\{([^|{}]+)\|([GH][\d_A-Z]+)\}/g; let m;
  while((m=re.exec(txt))!==null){
    if(m.index>last) segments.push({plain:txt.slice(last,m.index)});
    // Código especial H0_* o G0_* = prefijo/sufijo gramatical añadido
    const isAdded = /^[GH]0_/.test(m[2]);
    segments.push({word:m[1],code:m[2],added:isAdded});
    last=m.index+m[0].length;
  }
  if(last<txt.length) segments.push({plain:txt.slice(last)});
  const map=isG?_SW_G:_SW_H;
  if(!interlinear){
    const mkSw=(word,code,added)=>{
      if(added) return `<span class="sw sw-added">${word}</span>`;
      return `<span class="sw" data-s="${code}" onclick="event.stopPropagation();showStrong('${code.replace(/'/g,"\\'")}','${word.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">${word}</span>`;
    };
    return segments.map(seg=>{
      if(seg.code) return mkSw(seg.word,seg.code,seg.added);
      return seg.plain.replace(/[\w\u00C0-\u024F]+/g,tok=>{
        const base=tok.replace(/[.,;:!?¿¡]+$/,''),suf=tok.slice(base.length);
        const code=map[_normStr(base)];
        return code?mkSw(base,code,/^[GH]0_/.test(code))+suf:tok;
      });
    }).join('');
  }
  const mkIw=(word,code,suf='',added=false)=>{
    if(added) return `<span class="iw-plain sw-added">${word}${suf}</span>`;
    return `<span class="iw" onclick="event.stopPropagation();showStrong('${code.replace(/'/g,"\\'")}','${word.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')"><span class="iw-t">${word}${suf}</span><span class="iw-c">${code}</span></span>`;
  };
  return segments.map(seg=>{
    if(seg.code) return mkIw(seg.word,seg.code,'',seg.added);
    return seg.plain.replace(/[\w\u00C0-\u024F]+/g,tok=>{
      const base=tok.replace(/[.,;:!?¿¡]+$/,''),suf=tok.slice(base.length);
      const code=map[_normStr(base)];
      const added=code&&/^[GH]0_/.test(code);
      return code?mkIw(base,code,suf,added):`<span class="iw-plain">${tok}</span>`;
    });
  }).join(' ');
}

async function searchVersos(query, onResult, onDone) {
  const q = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let count = 0, MAX = 60;
  const data = await loadBibleData();
  for (const book of ALL) {
    if (count >= MAX) break;
    const bookData = findBookInData(data, book);
    if (!bookData || !bookData.capitulos) continue;
    for (const chap of bookData.capitulos) {
      if (count >= MAX) break;
      const capNum = chap.numero;
      if (!chap.versiculos) continue;
      for (const vers of chap.versiculos) {
        if (count >= MAX) break;
        // Reconstruir texto plano desde palabras
        const plainText = (vers.palabras||[]).map(p=>p.texto||'').join(' ');
        const normTxt = plainText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if (normTxt.includes(q)) {
          count++;
          const clean = subst(plainText);
          onResult({ book, cap: capNum, verse: vers.numero, text: clean, preview: highlight(clean, query) });
        }
      }
    }
  }
  onDone(count);
}
function highlight(text,q){
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return text.replace(re,m=>`<em>${m}</em>`).slice(0,160)+(text.length>160?'…':'');
}
function parseRef(q){
  const n=q.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const m=n.match(/^([a-z1-3]+)\s+(\d+)(?::(\d+))?$/);
  if(!m) return null;
  const bookId=ABBREVS[m[1]]; if(!bookId) return null;
  const book=ALL.find(x=>x.id===bookId); if(!book) return null;
  return {book,cap:+m[2],verse:m[3]?+m[3]:null};
}

const _sHist=[];
async function showStrong(code,word){
  _sHist.push({code,word});
  document.getElementById('smod-back').style.display=_sHist.length>1?'inline-block':'none';
  document.getElementById('smod-code').textContent=code;
  document.getElementById('smod-word').textContent=word||code;
  document.getElementById('smod-body').innerHTML=`<div style="display:flex;justify-content:center;padding:24px"><div class="spin"></div></div>`;
  const isG=code[0]==='G';
  document.getElementById('smod-link').href=`https://www.blueletterbible.org/lexicon/${code}/rvr60/${isG?'tr':'wlc'}/0-1/`;
  document.getElementById('strong-modal').classList.add('show');
  await loadStrong(isG);
  const dict=isG?_SG:_SH;
  const el=document.getElementById('smod-body');

  // ── Buscar entrada con y sin cero de padding ──
  let entry = dict ? _dictEntry(dict, code) : null;

  if (entry && typeof entry === 'object' && entry.definition) {
    el.innerHTML = renderStrongCard(entry, isG);
    // Hacer clickables los strongs relacionados
    el.querySelectorAll('[data-sw]').forEach(a => {
      a.style.cssText='color:var(--cobalt);cursor:pointer;border-bottom:1px dotted rgba(26,58,139,.4);font-family:var(--m);font-size:.72rem;';
      a.onclick=ev=>{ ev.stopPropagation(); showStrong(a.dataset.sw,''); };
    });
    return;
  }

  // Fallback API pública
  const num=parseInt(code.slice(1));
  try{
    const r=await fetch(`https://api.getbible.net/v2/strongs/${isG?'greek':'hebrew'}/${num}.json`);
    if(r.ok){
      const d=await r.json();
      el.innerHTML=`<div class="smod-section">
        ${d.translit?`<b>Transliteración:</b> <span class="Trn">${d.translit}</span><br>`:''}
        ${d.gloss?`<b>Glosa:</b> <span>${d.gloss}</span><br>`:''}
        ${d.strongs_def?`<hr><span style="line-height:1.78;font-size:.9rem">${d.strongs_def}</span>`:''}
      </div>`;
      return;
    }
  }catch{}
  el.innerHTML=`<p class="smod-empty">Sin datos para <strong>${code}</strong>.<br>Abrí el enlace para ver la definición completa.</p>`;
}

function renderStrongCard(e, isG) {
  const parts = [];

  // ── Bloque de lexema ──────────────────────────────────────────────
  const lemmaFont = isG ? 'font-family:var(--r);font-style:italic;font-size:2rem' : 'font-family:var(--h);font-size:2.2rem';
  parts.push(`<div class="smod-lexema-row">
    <div class="smod-lemma" style="${lemmaFont}">${e.lemma||''}</div>
    <div class="smod-translit-block">
      <div class="smod-translit">${e.transliteration||''}</div>
      ${e.occurrences_bhs?`<div class="smod-occ">${e.occurrences_bhs} veces en el AT</div>`:''}
      ${e.occurrences_na27?`<div class="smod-occ">${e.occurrences_na27} veces en el NT</div>`:''}
    </div>
  </div>`);

  // ── Tags: gramática + dominio ─────────────────────────────────────
  const tagItems = [
    e.grammar || e.grammar_os,
    e.semantic_domain,
    e.language,
  ].filter(Boolean);
  if (tagItems.length) {
    parts.push(`<div class="smod-tags">${tagItems.map(t=>`<span class="smod-tag">${t}</span>`).join('')}</div>`);
  }

  // ── Definición ────────────────────────────────────────────────────
  if (e.definition) {
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Definición Strong</div>
      <div class="smod-def">${e.definition}</div>
    </div>`);
  }

  // ── Rango semántico (enriquecimiento) ─────────────────────────────
  if (e.semantic_range) {
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Rango semántico</div>
      <div class="smod-def" style="line-height:1.75">${e.semantic_range}</div>
    </div>`);
  }

  // ── Opciones de traducción ────────────────────────────────────────
  if (e.translation_options && e.translation_options.length) {
    const chips = e.translation_options.slice(0,12)
      .map(t=>`<span class="smod-chip">${t}</span>`).join('');
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Traducido como</div>
      <div class="smod-chips">${chips}</div>
    </div>`);
  }

  // ── Nota teológica ────────────────────────────────────────────────
  if (e.theological_note) {
    parts.push(`<div class="smod-section smod-theology">
      <div class="smod-sec-lbl">📖 Nota Teológica</div>
      <div class="smod-def" style="line-height:1.78">${e.theological_note}</div>
    </div>`);
  }

  // ── Nombres divinos de YHWH ───────────────────────────────────────
  if (e.divine_names && e.divine_names.length) {
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">✡ Nombres Compuestos</div>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${e.divine_names.map(n=>`<div class="smod-divine">${n}</div>`).join('')}
      </div>
    </div>`);
  }

  // ── Versículos clave ──────────────────────────────────────────────
  if (e.key_verses && e.key_verses.length) {
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Versículos clave</div>
      <div class="smod-chips">${e.key_verses.map(v=>`<span class="smod-chip smod-chip-ref">${v}</span>`).join('')}</div>
    </div>`);
  }

  // ── Nota BDAG ────────────────────────────────────────────────────
  if (e.bdag_note) {
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">BDAG</div>
      <div class="smod-def smod-italic">${e.bdag_note}</div>
    </div>`);
  }

  // ── Equivalentes LXX ─────────────────────────────────────────────
  if (!isG && e.lxx_equivalents && e.lxx_equivalents.length) {
    const items = e.lxx_equivalents.slice(0,5).map(x=>
      `<span class="smod-link-item" data-sw="${x.strong}">${x.greek} <span style="font-family:var(--m);font-size:.55rem;color:var(--gold)">${x.strong}</span></span>`
    ).join('');
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Equivalente griego (LXX)</div>
      <div class="smod-linked">${items}</div>
    </div>`);
  }

  // ── Equivalentes hebreos ──────────────────────────────────────────
  if (isG && e.hebrew_equivalents && e.hebrew_equivalents.length) {
    const items = e.hebrew_equivalents.slice(0,5).map(x=>
      `<span class="smod-link-item" data-sw="${x.strong}"><span style="font-family:var(--h);font-size:1.1rem">${x.hebrew}</span> <span style="font-family:var(--m);font-size:.55rem;color:var(--gold)">${x.strong}</span></span>`
    ).join('');
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Trasfondo hebreo (LXX)</div>
      <div class="smod-linked">${items}</div>
    </div>`);
  }

  // ── Cognados ─────────────────────────────────────────────────────
  const cogs = e.cognates;
  if (cogs && cogs.length) {
    const show = cogs.slice(0,6);
    const items = show.map(c => {
      const lbl = isG
        ? `<span style="font-family:var(--r);font-style:italic">${c.greek||''}</span>`
        : `<span style="font-family:var(--h)">${c.hebrew||''}</span> ${c.name||''}`;
      return `<span class="smod-link-item" data-sw="${c.strong}">${lbl} <span style="font-family:var(--m);font-size:.55rem;color:var(--gold)">${c.strong}</span></span>`
    }).join('');
    parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Palabras relacionadas</div>
      <div class="smod-linked">${items}</div>
    </div>`);
  }

  // ── Sinónimos / Antónimos (solo griego) ──────────────────────────
  if (isG) {
    if (e.synonyms && e.synonyms.length) {
      parts.push(`<div class="smod-section">
        <div class="smod-sec-lbl">Sinónimos</div>
        <div class="smod-linked">${e.synonyms.slice(0,5).map(s=>`<span class="smod-link-item" data-sw="${s.strong}"><span style="font-family:var(--r);font-style:italic">${s.transliteration}</span> <span style="font-family:var(--m);font-size:.55rem;color:var(--gold)">${s.strong}</span></span>`).join('')}</div>
      </div>`);
    }
    if (e.antonyms && e.antonyms.length) {
      parts.push(`<div class="smod-section">
        <div class="smod-sec-lbl">Antónimos</div>
        <div class="smod-linked">${e.antonyms.slice(0,4).map(s=>`<span class="smod-link-item" data-sw="${s.strong}"><span style="font-family:var(--r);font-style:italic">${s.transliteration}</span> <span style="font-family:var(--m);font-size:.55rem;color:var(--gold)">${s.strong}</span></span>`).join('')}</div>
      </div>`);
    }
  }

  // ── Lenguas cognadas ─────────────────────────────────────────────
  if (!isG && e.cognate_languages) {
    const langs = Object.entries(e.cognate_languages).map(([k,v])=>
      `<span class="smod-chip smod-chip-lang"><em>${k}:</em> ${v}</span>`
    ).join('');
    if (langs) parts.push(`<div class="smod-section">
      <div class="smod-sec-lbl">Lenguas cognadas</div>
      <div class="smod-chips">${langs}</div>
    </div>`);
  }

  // ── Referencias académicas ────────────────────────────────────────
  const refs = [
    e.bdb_ref   && `BDB: <strong>${e.bdb_ref}</strong>`,
    e.twot_ref  && `TWOT: <strong>${e.twot_ref}</strong>`,
    e.gk_number && `GK: <strong>${e.gk_number}</strong>`,
    e.louw_nida && e.louw_nida.length && `L-N: <strong>${e.louw_nida[0].ref}</strong>${e.louw_nida[0].domain?' · '+e.louw_nida[0].domain:''}`,
  ].filter(Boolean);
  if (refs.length) {
    parts.push(`<div class="smod-section smod-refs">
      <div class="smod-sec-lbl">Referencias académicas</div>
      <div style="font-family:var(--m);font-size:.66rem;color:var(--ink3);line-height:2">${refs.join(' &nbsp;·&nbsp; ')}</div>
    </div>`);
  }

  return parts.join('');
}

">Sin resultados para "<strong>${q}</strong>" en toda la Biblia</div>`; else{ const info=document.createElement('div'); info.style.cssText='font-family:var(--m);font-size:.56rem;color:var(--ink3);text-align:center;padding:10px 0;letter-spacing:.07em;text-transform:uppercase'; info.textContent=`${count}${count>=60?' ':''}  resultado${count!==1?'s':''} encontrado${count!==1?'s':''}`; resultEl.prepend(info); } }); }

function sendComment(postRealIdx,displayIdx){ const inp=document.getElementById('pci'+displayIdx); const txt=(inp?.value||'').trim(); if(!txt) return; const p=_S.posts[postRealIdx]; if(!p) return; const pid=p._id||('p'+postRealIdx); const comments={..._S.comments}; if(!comments[pid]) comments[pid]=[]; const entry={autor:_S.user.n||'Tú',texto:txt,ts:Date.now()}; comments[pid]=[...comments[pid],entry]; setState({comments},['comments']); const list=document.getElementById('pcl'+displayIdx); if(list){const d=document.createElement('div');d.className='comment-item';d.innerHTML=`<strong>${entry.autor}</strong>  ${txt}`;list.appendChild(d);} inp.value=''; inp.focus(); }
function sharePost(txt,ref){shareText(txt,ref)}

function renderProfile(){ const dark=_S.dark, fs=_S.fs; const atLeido=_S.leidos.filter(x=>AT.some(b=>b.id===x.l)).length; const ntLeido=_S.leidos.filter(x=>NT.some(b=>b.id===x.l)).length; const atTotal=AT.reduce((s,b)=>s+b.c,0); const ntTotal=NT.reduce((s,b)=>s+b.c,0); _ca().innerHTML=`<div class="pf-hero fade-in"><div class="pf-ava">${(_S.user.n||'?')[0].toUpperCase()}</div><div class="pf-name">${_S.user.n} ${_S.user.a}${_S.user.esLider?'<span class="badge">Líder</span>':''}</div><div class="pf-sub">Shalom Aleijem · El Lugar</div></div><div class="stats-row"><div class="stat"><div class="stat-n">${_S.leidos.length}</div><div class="stat-l">Capítulos</div></div><div class="stat"><div class="stat-n">${_S.streak}</div><div class="stat-l">Racha días</div></div><div class="stat"><div class="stat-n">${_S.notas.length}</div><div class="stat-l">Notas</div></div><div class="stat"><div class="stat-n">${_S.bookmarks.length}</div><div class="stat-l">Marcadores</div></div></div><div class="prog-section"><div class="prog-lbl"><span>Antiguo Pacto</span><span>${atLeido}/${atTotal} cap. · ${Math.round(atLeido/atTotal*100)}%</span></div><div class="prog-track"><div class="prog-fill at" style="width:${atLeido/atTotal*100}%"></div></div><div class="prog-lbl" style="margin-top:10px"><span>Pacto Renovado</span><span>${ntLeido}/${ntTotal} cap. · ${Math.round(ntLeido/ntTotal*100)}%</span></div><div class="prog-track"><div class="prog-fill nt" style="width:${ntLeido/ntTotal*100}%"></div></div></div><div class="settings-sect"><div class="set-lbl">Apariencia</div><div class="set-item" onclick="toggleDark()"><div class="set-left"><span class="set-ico">🌙</span><span class="set-t">Modo Oscuro</span></div><div class="toggle ${dark?'on':''}" id="dark-toggle"></div></div><div class="set-item" onclick="toggleInterlinear()"><div class="set-left"><span class="set-ico">αβ</span><span class="set-t">Modo Interlineal</span></div><div class="toggle ${_S.interlinear?'on':''}" id="ilin-toggle"></div></div><div class="set-item" style="cursor:default;flex-direction:column;align-items:flex-start;gap:9px;padding-bottom:13px"><div class="set-left"><span class="set-ico">🔤</span><span class="set-t">Tamaño de fuente</span></div><div class="fs-row">${['small','normal','large','xlarge'].map(s=>`<div class="fs-btn ${fs===s?'on':''}" onclick="setFS('${s}')">${{small:'Pequeña',normal:'Normal',large:'Grande',xlarge:'Muy Grande'}[s]}</div>`).join('')}</div></div><div class="set-lbl">Datos</div><div class="set-item" style="cursor:default"><div class="set-left"><span class="set-ico">📊</span><span class="set-t">Progreso total de lectura</span></div><span class="set-v">${Math.round(_S.leidos.length/1189*100)}%</span></div><div class="set-item" style="cursor:default"><div class="set-left"><span class="set-ico">🎨</span><span class="set-t">Versículos resaltados</span></div><span class="set-v">${Object.keys(_S.hl).length}</span></div><div class="set-item" style="cursor:default"><div class="set-left"><span class="set-ico">⭐</span><span class="set-t">Libros favoritos</span></div><span class="set-v">${_S.favs.length}</span></div><div class="set-item" onclick="exportData()"><div class="set-left"><span class="set-ico">💾</span><span class="set-t">Exportar notas</span></div><span class="set-v">↗</span></div></div><button class="btn-logout" onclick="logout()">Cerrar Sesión</button><div style="height:20px"></div>`; }
function toggleDark(){ setState({dark:!_S.dark},['dark']); document.documentElement.setAttribute('data-theme',_S.dark?'dark':'light'); document.getElementById('dark-toggle')?.classList.toggle('on',_S.dark); document.getElementById('ilin-toggle')?.classList.toggle('on',_S.interlinear); toast(_S.dark?'🌙 Modo oscuro':'☀️ Modo claro'); }
function setFS(s){ setState({fs:s},['fs']); document.documentElement.setAttribute('data-fs',s); renderProfile(); }
function exportData(){ const data={notas:_S.notas,marcadores:_S.bookmarks,resaltados:_S.hl}; const json=JSON.stringify(data,null,2); const blob=new Blob([json],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`ellugar_notas_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href); toast('💾 Notas exportadas'); }

function openModal(mode,ctx){ const m=mode||'nota'; setState({modalMode:m,notaEdit:null, notaCtx:ctx||{libro:_S.libro?.e||'—',cap:_S.cap||'—',versiculo:null}}); const titles={nota:'Nueva Nota',foro:'Nueva Publicación',reflexion:'Nueva Reflexión Ictis'}; document.getElementById('modal-title').textContent=titles[m]||'Nuevo'; const mr=document.getElementById('modal-ref'); const mx=document.getElementById('modal-extra'); const ta=document.getElementById('modal-ta'); ta.value=''; ta.style.minHeight='88px'; document.getElementById('modal-save').textContent='Guardar'; if(m==='nota'){ const c=ctx||_S.notaCtx; mr.textContent=c?.versiculo?`📖 ${c.libro} ${c.cap}:${c.versiculo}`:''; mr.style.display=c?.versiculo?'block':'none'; mx.style.display='none'; ta.placeholder='Escribe tu reflexión o comentario…'; } else { mr.style.display='none'; mx.value=''; mx.style.display='block'; mx.placeholder=m==='reflexion'?'Título del estudio (obligatorio)':'Título (opcional)'; ta.placeholder=m==='reflexion'?'Escribe el contenido del estudio…':'Comparte tu reflexión…'; ta.style.minHeight=m==='reflexion'?'180px':'90px'; document.getElementById('modal-save').textContent='Publicar'; } document.getElementById('modal').classList.add('show'); setTimeout(()=>(m==='nota'?ta:mx).focus(),150); }
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveModal(){ const m=_S.modalMode||'nota'; const txt=document.getElementById('modal-ta').value.trim(); if(!txt) return; const now=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}); if(m==='nota'){ if(_S.notaEdit!==null){ const notas=[..._S.notas]; notas[_S.notaEdit]={...notas[_S.notaEdit],texto:txt,fecha:now+' (editada)'}; setState({notas,notaEdit:null},['notas']); } else { const c=_S.notaCtx; setState({notas:[..._S.notas,{libro:c?.libro||'—',cap:c?.cap||'—',versiculo:c?.versiculo||null,texto:txt,fecha:now}]},['notas']); } toast('✅ Nota guardada'); if(_S.tab==='notes') renderNotes(); } else if(m==='reflexion'){ if(!_S.user.esLider){toast('⚠️ Solo líderes pueden publicar estudios');return} const titulo=document.getElementById('modal-extra').value.trim(); if(!titulo){toast('⚠️ El título es obligatorio');document.getElementById('modal-extra').focus();return} const miNombre=`${_S.user.n} ${_S.user.a}`.trim()||'Líder'; setState({estudios:[..._S.estudios,{titulo,cuerpo:txt,autor:miNombre,fecha:now}]},['estudios']); toast('✅ Estudio publicado'); if(_S.tab==='forum') renderForum(); else if(_S.tab==='home') renderHome(); } else { const titulo=document.getElementById('modal-extra').value.trim(); const miNombre=`${_S.user.n} ${_S.user.a}`.trim()||'Anónimo'; const post={_id:'p'+Date.now(),titulo,texto:txt,esForo:true, esLider:_S.user.esLider,autor:miNombre,fecha:now}; setState({posts:[..._S.posts,post]},['posts']); toast('✅ Publicación enviada'); if(_S.tab==='forum') renderForum(); else if(_S.tab==='home') renderHome(); } closeModal(); }

function shareText(txt,ref){ const t=`${ref?ref+'\n\n':''}${txt}\n\n— El Lugar · Comunidad`; if(navigator.share) navigator.share({title:'El Lugar',text:t}).catch(()=>{}); else navigator.clipboard?.writeText(t).then(()=>toast('📋 Copiado al portapapeles')).catch(()=>toast('No se pudo compartir')); }
function _showFab(){document.getElementById('fab').classList.add('show')}
function _hideFab(){document.getElementById('fab').classList.remove('show')}
function toast(msg){ const t=document.createElement('div');t.className='toast';t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.style.opacity='0',1700); setTimeout(()=>t.remove(),2000); }
function logout(){ if(confirm('¿Cerrar sesión? Se conservarán tus notas y favoritos.')){ localStorage.removeItem('v3_user');location.reload(); } }

function doLogin(){ const n=document.getElementById('in-n').value.trim(); const a=document.getElementById('in-a').value.trim(); if(!n){document.getElementById('in-n').focus();return} const lv=document.getElementById('in-lider').value.trim(); const esLider=lv&&(Array.from(lv).map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('')===LIDER_HASH); if(lv&&!esLider){toast('⚠️ Código incorrecto');return} setState({user:{n,a,esLider}},['user']); document.getElementById('l-login').classList.remove('show'); document.getElementById('app').classList.add('show'); if(esLider) toast('✅ Acceso de Líder habilitado'); navTo('home'); }

// Inicialización
window.onload = async () => {
  if(_S.dark) document.documentElement.setAttribute('data-theme','dark');
  if(_S.fs!=='normal') document.documentElement.setAttribute('data-fs',_S.fs);
  try {
    await loadBibleData();
    console.log('Biblia cargada correctamente');
  } catch(e) {
    console.error('Error crítico:', e);
  }
  setTimeout(() => {
    const splash = document.getElementById('l-splash');
    if(splash) splash.classList.remove('show');
    if(_S.user && _S.user.n) {
      document.getElementById('app').classList.add('show');
      if(_S.ultima && _S.ultima.libroId && _S.ultima.cap) {
        const l = ALL.find(x=>x.id===_S.ultima.libroId);
        if(l) {
          setState({tab:'lib', libro:l, cap:_S.ultima.cap, hist:[{type:'lib'}]});
          _setNav('lib');
          _setHdr(`${l.e} ${_S.ultima.cap}`, true, false, true);
          _openCap(l, _S.ultima.cap);
          return;
        }
      }
      navTo('home');
    } else {
      document.getElementById('l-login').classList.add('show');
    }
  }, 2500);
};

document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.getElementById('l-login').classList.contains('show')) doLogin(); if(e.key==='Escape'){closeModal();closeStrong();closeVAction();} });
document.getElementById('vaction').addEventListener('click',e=>{ if(e.target===document.getElementById('vaction')) closeVAction(); });
document.getElementById('strong-modal').addEventListener('click',e=>{ if(e.target===document.getElementById('strong-modal')) closeStrong(); });
</script>
